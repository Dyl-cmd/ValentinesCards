<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Day Card</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <style>
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart-anim {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 20px;
            background: red;
            clip-path: polygon(50% 0%, 100% 40%, 80% 100%, 50% 80%, 20% 100%, 0% 40%);
            animation: floatUp 6s linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-150vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <link href='https://fonts.googleapis.com/css?family=Solitreo' rel='stylesheet'>
    <div class="container" id="valentineCard">
        <div class="envelope"></div>
        <div class="card">
            <h1 class="message">Dear, Liv<br>Will you be my Valentine?<br></h1>
            <div class="heart"></div>
        </div>
        <div class="cover"></div>
        <div class="lid"></div>
        <div class="shadow"></div>
    </div>
    <div class="floating-hearts"></div>
    <script>
        document.getElementById("valentineCard").addEventListener("click", function() {
            this.classList.toggle("active");
            if (this.classList.contains("active")) {
                for (let i = 0; i < 20; i++) {
                    let heart = document.createElement("div");
                    heart.classList.add("heart-anim");
                    heart.style.left = Math.random() * 100 + "vw";
                    heart.style.animationDuration = (Math.random() * 2 + 4) + "s";
                    document.querySelector(".floating-hearts").appendChild(heart);
                    setTimeout(() => heart.remove(), 6000);
                }
            }
        });
    </script>
</body>
</html>
